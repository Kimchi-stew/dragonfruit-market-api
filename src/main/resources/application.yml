      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  profiles:
    active: local
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id:
              hVP0qA7lHbl_0WIfaUOR
            client-secret:
              h_HG687fAm
            scope:
              - email
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "https://alvin1105.cloud/login/oauth2/code/naver"
          kakao:
            client-id: 5f053f61b489bb2a8e913e9ffbaa5542
            client-secret: YnhwnbTwgEKcp1setRm7mX9KtwWiEjHO
